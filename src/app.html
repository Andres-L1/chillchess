<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/logo-mobile.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0B0E14" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

	<!-- Performance: Preconnect to critical origins -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
		rel="stylesheet">


	<title>ChillChess</title>
	<meta name="description"
		content="Tu navaja suiza digital para freelancers. Calculadora de tarifas, facturas, Pomodoro, Kanban, QR y más." />

	<!-- Open Graph -->
	<meta property="og:type" content="website" />
	<meta property="og:title" content="ChillChess" />
	<meta property="og:description"
		content="Tu navaja suiza digital para freelancers. Calculadora de tarifas, facturas, Pomodoro, Kanban, QR y más." />
	<meta property="og:image" content="%sveltekit.assets%/logo-desktop.png" />

	%sveltekit.head%
</head>

<body class="bg-[#0B0E14] text-slate-200 font-sans flex min-h-[100dvh] overflow-x-hidden w-full">
	<div style="display: contents" class="h-full w-full">%sveltekit.body%</div>
</body>

</html>
