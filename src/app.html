<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/logo-mobile.png" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="theme-color" content="#0B0E14" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

	<!-- Performance: Preconnect to critical origins -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

	<title>Multi-Herramientas Web</title>
	<meta name="description" content="Colección de herramientas útiles para productividad, finanzas, y más." />
	%sveltekit.head%
</head>

<body class="bg-slate-50 text-slate-800 font-sans flex min-h-[100dvh] overflow-x-hidden">
	<div style="display: contents" class="h-full w-full">%sveltekit.body%</div>
</body>

</html>
