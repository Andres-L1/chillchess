name = "chillchess-habit-notifications"
main = "workers/habitNotifications.ts"
compatibility_date = "2024-01-01"

# Cron trigger - Se ejecuta cada hora
[triggers]
crons = ["0 * * * *"]  # Cada hora en punto (00:00, 01:00, 02:00, etc.)

# Variables de entorno (configura en Cloudflare Dashboard)
[vars]
FB_PROJECT_ID = "chillchess-57365"

