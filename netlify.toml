[build]
  command = "npm run build"
  publish = "build"

[context.production.environment]
  NODE_VERSION = "20"
  # VITE_FIREBASE_API_KEY and other Firebase variables should be configured via Netlify UI -> Site settings -> Environment variables.
  # Do not hardcode secrets in this file.
  # R2 Configuration — set these in the Netlify UI under Site Settings > Environment Variables
  # PUBLIC_R2_ACCOUNT_ID = "your-account-id"
  # R2_ACCESS_KEY_ID = "your-access-key-id"
  # R2_SECRET_ACCESS_KEY = "your-secret-access-key"
  # R2_BUCKET_NAME = "your-bucket-name"

[build.environment]
  NODE_VERSION = "20"
  # Whitelist public Firebase API Key for secret scanner to prevent build false positives
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDkAPVdrwASXA-O5ajBU7T14qbKSfef5EI"

# Aggressive caching for static assets
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# HTML pages - short cache with revalidation
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # same-origin-allow-popups is required for Firebase signInWithPopup (Google OAuth) to work.
    # Using 'same-origin' breaks window.closed communication and the login popup.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseio.com https://*.firebaseapp.com https://*.google.com https://*.gstatic.com https://apis.google.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.firebasestorage.app https://*.googleusercontent.com; connect-src 'self' wss://*.firebaseio.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://apis.google.com https://*.google.com https://*.stripe.com https://api.stripe.com https://*.cloudfunctions.net https://open.er-api.com; frame-src 'self' https://js.stripe.com https://*.firebaseapp.com https://*.google.com https://accounts.google.com;"

