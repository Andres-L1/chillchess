[build]
  command = "npm run build"
  publish = "build"

[context.production.environment]
  NODE_VERSION = "20"
  # VITE_FIREBASE_API_KEY and other Firebase variables should be configured via Netlify UI -> Site settings -> Environment variables.
  # Do not hardcode secrets in this file.
  # R2 Configuration — set these in the Netlify UI under Site Settings > Environment Variables
  # PUBLIC_R2_ACCOUNT_ID = "your-account-id"
  # R2_ACCESS_KEY_ID = "your-access-key-id"
  # R2_SECRET_ACCESS_KEY = "your-secret-access-key"
  # R2_BUCKET_NAME = "your-bucket-name"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Aggressive caching for static assets
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    cache-control = "public, max-age=604800, immutable"

# HTML pages - short cache with revalidation
[[headers]]
  for = "/*.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/widgets/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseio.com https://*.firebaseapp.com https://*.google.com https://*.gstatic.com https://apis.google.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.firebasestorage.app https://*.googleusercontent.com; connect-src 'self' wss://*.firebaseio.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://apis.google.com https://*.google.com https://*.googleusercontent.com https://*.stripe.com https://api.stripe.com https://*.cloudfunctions.net https://open.er-api.com wss://irc-ws.chat.twitch.tv https://*.twitch.tv; frame-src 'self' https://js.stripe.com https://*.firebaseapp.com https://*.google.com https://accounts.google.com;"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Setting to unsafe-none to bypass window.closed blocks in Firebase Auth popups
    Cross-Origin-Opener-Policy = "unsafe-none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebaseio.com https://*.firebaseapp.com https://*.google.com https://*.gstatic.com https://apis.google.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.firebasestorage.app https://*.googleusercontent.com; connect-src 'self' wss://*.firebaseio.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://apis.google.com https://*.google.com https://*.googleusercontent.com https://*.stripe.com https://api.stripe.com https://*.cloudfunctions.net https://open.er-api.com; frame-src 'self' https://js.stripe.com https://*.firebaseapp.com https://*.google.com https://accounts.google.com;"

